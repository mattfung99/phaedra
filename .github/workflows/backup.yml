name: Backup

on:
  schedule:
    - cron: '0 2 * * 0' # Sundays 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_SERVICE_ROLE not set — skipping backup"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - if: steps.cfg.outputs.ready == 'true'
        run: corepack enable
      - if: steps.cfg.outputs.ready == 'true'
        run: yarn install --immutable
      - if: steps.cfg.outputs.ready == 'true'
        run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phaedra-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
