name: Migrations

on:
  pull_request:
    paths: ['supabase/**']
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/functions/**'

jobs:
  # On PRs: prove migrations apply cleanly against a throwaway local database.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations to a local database
        run: |
          supabase start
          supabase db reset
          supabase stop

  # On merge to master: apply migrations + deploy Edge Functions to production.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # Skip gracefully until the CLI secrets are configured (schema is otherwise
      # applied via the Supabase MCP), so master stays green.
      - id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping remote db push / function deploy"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase db push
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy save-post delete-post
