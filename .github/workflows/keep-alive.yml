name: Keep Alive

# Free-tier Supabase projects pause after 7 idle days. A few tiny writes a day to
# the keep_alive singleton (anon RLS allows it) keeps prod awake.
on:
  schedule:
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ping keep_alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sfS -X PATCH \
            "$SUPABASE_URL/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%FT%TZ)\"}"
