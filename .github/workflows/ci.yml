name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # Deno-runtime tests for the Edge Functions (e.g. the content sanitizer).
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=auto so Deno auto-installs the npm deps (sanitize-html)
      # regardless of CWD-based config discovery.
      - run: deno test -A --node-modules-dir=auto supabase/functions/_shared/
