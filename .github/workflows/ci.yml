name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
        env:
          # Placeholder — verify only needs the build to compile; real data flow is
          # exercised in the e2e job against local Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  # Deno-runtime tests for the Edge Functions (e.g. the content sanitizer).
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=auto so Deno auto-installs the npm deps (sanitize-html)
      # regardless of CWD-based config discovery.
      - run: deno test -A --node-modules-dir=auto supabase/functions/_shared/
